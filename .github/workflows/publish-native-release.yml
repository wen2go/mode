name: Publish native release

on:
  push:
    tags:
      - 'mode_20*_v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag, for example mode_20260914_v27.0.0-pre'
        required: true
        type: string

permissions:
  contents: write

jobs:
  validate-release-tag:
    runs-on: ubuntu-24.04
    outputs:
      release_tag: ${{ steps.release.outputs.tag }}
      release_suffix: ${{ steps.release.outputs.suffix }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - id: release
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          node_major=$(awk '/^#define NODE_MAJOR_VERSION/ { print $3 }' src/node_version.h)
          node_minor=$(awk '/^#define NODE_MINOR_VERSION/ { print $3 }' src/node_version.h)
          node_patch=$(awk '/^#define NODE_PATCH_VERSION/ { print $3 }' src/node_version.h)
          node_suffix=''
          if [[ "$(awk '/^#define NODE_VERSION_IS_RELEASE/ { print $3 }' src/node_version.h)" == 0 ]]; then
            node_suffix='-pre'
          fi
          node_version="v${node_major}.${node_minor}.${node_patch}${node_suffix}"
          tag_pattern="^mode_[0-9]{8}_${node_version//./\\.}(-r[1-9][0-9]*)?$"
          if [[ ! "$RELEASE_TAG" =~ $tag_pattern ]]; then
            echo "Release tag must use mode_YYYYmmdd_${node_version}: $RELEASE_TAG" >&2
            exit 1
          fi
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "suffix=${RELEASE_TAG#mode_}" >> "$GITHUB_OUTPUT"

  mac-arm64:
    needs: validate-release-tag
    runs-on: macos-15
    timeout-minutes: 120
    env:
      RELEASE_SUFFIX: ${{ needs.validate-release-tag.outputs.release_suffix }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Verify Apple Silicon runner
        run: test "$(uname -m)" = arm64
      - name: Configure and build
        run: |
          ./configure
          make -j3 node
      - name: Run Mode regressions
        run: |
          out/Release/node test/parallel/test-browser-env.js
      - name: Package
        run: |
          package="mode_mac_arm_${RELEASE_SUFFIX}"
          mkdir -p "dist/$package"
          cp out/Release/node "dist/$package/mode"
          tar -czf "dist/$package.tar.gz" -C dist "$package"
      - name: Stage release asset
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mode-mac-arm
          path: dist/*.tar.gz
          if-no-files-found: error

  windows-x64:
    needs: validate-release-tag
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      RELEASE_SUFFIX: ${{ needs.validate-release-tag.outputs.release_suffix }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Build x64 binary
        shell: cmd
        run: vcbuild.bat x64
      - name: Run Mode regressions
        shell: pwsh
        run: |
          .\out\Release\node.exe test\parallel\test-browser-env.js
      - name: Package
        shell: pwsh
        run: |
          $package = "mode_win_x64_$env:RELEASE_SUFFIX"
          New-Item -ItemType Directory -Path "dist\$package" -Force | Out-Null
          Copy-Item "out\Release\node.exe" "dist\$package\mode.exe"
          Compress-Archive -Path "dist\$package" -DestinationPath "dist\$package.zip"
      - name: Stage release asset
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mode-windows-x64
          path: dist/*.zip
          if-no-files-found: error

  linux-x64:
    needs: validate-release-tag
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      RELEASE_SUFFIX: ${{ needs.validate-release-tag.outputs.release_suffix }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Configure and build
        run: |
          ./configure
          make -j4 node
      - name: Run Mode regressions
        run: |
          out/Release/node test/parallel/test-browser-env.js
      - name: Package
        run: |
          package="mode_linux_x64_${RELEASE_SUFFIX}"
          mkdir -p "dist/$package"
          cp out/Release/node "dist/$package/mode"
          tar -czf "dist/$package.tar.gz" -C dist "$package"
      - name: Stage release asset
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mode-linux-x64
          path: dist/*.tar.gz
          if-no-files-found: error

  publish-release:
    needs: [validate-release-tag, mac-arm64, windows-x64, linux-x64]
    runs-on: ubuntu-24.04
    env:
      RELEASE_TAG: ${{ needs.validate-release-tag.outputs.release_tag }}
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
    steps:
      # --notes-from-tag reads the annotated tag through the local Git checkout.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true
      - name: 编写中文发布说明
        run: |
          printf '%s\n' \
            '## 本次更新' \
            '' \
            '- 补齐 `HTMLDivElement`、`HTMLIFrameElement`、空锚点 URL、`NetworkInformation` 与 `BatteryManager`，修正挑战实际创建的 DOM/BOM 对象原型和标签。' \
            '- 浏览器环境方法现在为常见 `fn.toString()` 检测提供原生函数形态，并保留真实调用行为。' \
            '- 新增源码诊断器：可不重新编译而直接以当前工作区的浏览器环境源码执行缓存挑战，用于发布前定位环境差异。' \
            '- 浏览器环境隐藏 Node 专有的 `performance.markResourceTiming`，与 Chromium 页面接口保持一致。' \
            '- 保持 `document.all`、原始 HTML、动态 UA、Cookie、Storage 与 location/history 的兼容行为。' \
            '' \
            '## 构建与验证' \
            '' \
            '- 已在 macOS ARM64、Windows x64、Linux x64 统一构建，并执行浏览器环境回归测试。' \
            > release-notes.md
      - name: Create or update the unified release
        run: |
          shopt -s nullglob
          assets=(dist/*.tar.gz dist/*.zip)
          if (( ${#assets[@]} != 3 )); then
            echo "Expected exactly three release assets:" >&2
            find dist -maxdepth 2 -type f -print >&2
            exit 1
          fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --title "$RELEASE_TAG" --notes-file release-notes.md
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" \
              --verify-tag --title "$RELEASE_TAG" --notes-file release-notes.md
          fi
